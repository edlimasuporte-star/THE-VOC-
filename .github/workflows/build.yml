name: Build THE VOC

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Teste do motor DSP (afinacao das vozes)
        if: runner.os != 'Windows'
        run: |
          c++ -O2 -std=c++17 -o engine_test tests/engine_test.cpp
          ./engine_test

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Get-ChildItem -Path build -Recurse -Directory -Filter "THE VOC.vst3" | Select-Object -First 1
          Compress-Archive -Path $p.FullName -DestinationPath THE-VOC-windows-vst3.zip

      - name: Assinar plugin (macOS, ad-hoc)
        if: runner.os == 'macOS'
        run: |
          P="$(find build -type d -name 'THE VOC.vst3' | head -n 1)"
          codesign --force --deep -s - "$P"
          codesign --verify --deep --strict --verbose=2 "$P"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          P=$(find build -type d -name "THE VOC.vst3" | head -n 1)
          ditto -c -k --keepParent "$P" THE-VOC-macos-vst3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: THE-VOC-${{ runner.os }}
          path: THE-VOC-*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
